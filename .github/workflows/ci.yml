name: CI

# Build + tests unitaires (greatest) + couverture (gcov) à chaque push et PR.
on:
  push:
    branches: ['**']
  pull_request:

# Annule les runs obsolètes sur une même réf (push rapprochés).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc / make / gcov sont préinstallés sur ubuntu-latest.
      - name: Versions des outils
        run: gcc --version && make --version && gcov --version

      - name: Build release
        run: make

      - name: Tests unitaires
        run: make test

      - name: Dépendance lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # `make coverage-html` exécute `coverage` (résumé console) puis produit
      # tests/coverage/coverage.info (lcov, pour Codecov) et le rapport HTML.
      - name: Couverture de code (gcov + lcov)
        run: make coverage-html

      # Visualisation hébergée : badge README, commentaire de PR, annotations.
      # Token optionnel pour un dépôt public ; fail_ci_if_error=false pour ne
      # pas casser la CI si Codecov est indisponible ou le token absent.
      - name: Envoi vers Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Fallback sans service tiers : rapport HTML navigable téléchargeable
      # depuis la page du run (onglet « Artifacts »).
      - name: Artefact rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: tests/coverage/html

  ncurses-build:
    name: Build variante ncurses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendance ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      # Vérifie que le chemin logger_ncurses.c compile et lie toujours.
      - name: Build NCURSES=1
        run: make NCURSES=1
