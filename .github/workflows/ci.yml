name: CI

# Build + tests unitaires (greatest) + couverture (gcov) à chaque push et PR.
on:
  push:
    branches: ['**']
  pull_request:

# Annule les runs obsolètes sur une même réf (push rapprochés).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    # pull-requests: write → permet au commentaire de couverture sur les PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # gcc / make / gcov sont préinstallés sur ubuntu-latest.
      - name: Versions des outils
        run: gcc --version && make --version && gcov --version

      # WERROR=1 : sous GCC, tout warning bloque le build (régression interdite).
      # Le build local (macOS/clang) reste tolérant — voir le toggle dans le Makefile.
      - name: Build release
        run: make WERROR=1

      - name: Tests unitaires
        run: make test

      # gcovr (outil Python) remplace lcov : installation pip en quelques secondes
      # (Python préinstallé), un seul outil pour Cobertura XML + HTML + Markdown.
      - name: Dépendance gcovr
        run: pipx install gcovr

      # `make coverage-report` exécute `coverage` (= coverage-256 + coverage-16)
      # puis produit, via gcovr : coverage.xml (Cobertura), le rapport HTML et coverage.md.
      - name: Couverture de code (gcov + gcovr)
        run: make coverage-report

      # Résumé Markdown gcovr → visible dans le récap du run (Job Summary).
      # Le même fichier sert au commentaire de PR ci-dessous.
      - name: Résumé de couverture
        run: cat tests/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Visualisation hébergée : badge README, annotations.
      # Dépôt PRIVÉ → le token est OBLIGATOIRE (pas d'upload « tokenless »).
      # Créer le secret CODECOV_TOKEN, sinon cette étape échoue.
      # On envoie UNIQUEMENT le coverage.xml produit par gcovr (déjà filtré pour
      # exclure tests/). disable_search + plugins:noop empêchent l'action de
      # relancer son propre gcov sur les .gcda et d'y réinjecter les fichiers de
      # test — sans quoi Codecov reporterait aussi le répertoire tests/.
      - name: Envoi vers Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./tests/coverage/coverage.xml
          disable_search: true
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Commentaire de couverture sur la PR, 100 % GitHub (github-script, Node 24,
      # maintenu). Met à jour le commentaire existant au lieu d'en empiler, via
      # un marqueur HTML. Le code privé ne sort pas du dépôt.
      - name: Commentaire couverture (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('tests/coverage/coverage.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Fallback sans service tiers : rapport HTML navigable téléchargeable
      # depuis la page du run (onglet « Artifacts »).
      - name: Artefact rapport HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: tests/coverage/html

  test-asan:
    name: Tests sous AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rejoue la suite greatest instrumentée par AddressSanitizer : détecte
      # use-after-free, double-free et débordements dans les modules testés (et
      # leurs deps de link). Complète le job `test` (build + run nominal) et la
      # couverture, qui ne voient pas la sûreté mémoire à l'exécution.
      #
      # detect_leaks=0 : on cible les ERREURS mémoire, pas les fuites — le code a
      # des fuites connues hors périmètre (contextes de threads, etc.) qui
      # feraient échouer LeakSanitizer sans rapport avec ce qu'on veut garder vert.
      # abort_on_error=1 : tout rapport ASan fait échouer le job (exit non nul).
      - name: make test ASAN=1
        run: make test ASAN=1
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1

  integration-test:
    name: Test intégration client/serveur (16 pièces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Scénario bout-en-bout : compile un binaire ETERN_PARTS=16, lance
      # serveur + client. Le client résout le 4×4 et signale la solution
      # (INST_SOLUTION) ; le serveur l'affiche, sauvegarde son stock (.back) et
      # s'arrête. Le script vérifie que LES DEUX côtés ont le résultat, avec un
      # timeout borné (jamais bloquant). pkill/mktemp/bash sont préinstallés.
      - name: make test-integration
        run: make test-integration

  ncurses-build:
    name: Build variante ncurses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dépendance ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      # Vérifie que le chemin logger_ncurses.c compile et lie toujours.
      # WERROR=1 : tout warning gcc dans la variante ncurses bloque la CI.
      - name: Build NCURSES=1
        run: make NCURSES=1 WERROR=1

  cuda-build:
    name: Build variante CUDA (gpupruner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installe le toolkit CUDA (nvcc + cudart-dev) sans GPU : COMPILER et LIER
      # ne requièrent pas de carte NVIDIA. Méthode « network » → ne tire que les
      # sous-paquets nécessaires (rapide). nvcc fournit le compilateur, cudart-dev
      # les en-têtes <cuda_runtime.h> et la lib pour le link -lcudart.
      - name: Toolkit CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Version nvcc
        run: nvcc --version

      # Compile-check du chemin CUDA=1 (gpu_pruner.cu via nvcc + link -lcudart),
      # comme le job ncurses. NVCC_ARCH par défaut = sm_87 (Jetson Orin), que
      # CUDA 12.5 sait compiler sans GPU. CUDA_PATH est exporté par l'action
      # ci-dessus (le Makefile le respecte via `?=`). Le binaire n'est PAS exécuté :
      # les runners GitHub n'ont pas de GPU NVIDIA. WERROR=1 bloque la CI sur tout
      # warning, côté gcc (code C sous WITH_CUDA : autoprune_gpu, etii_search.c)
      # ET côté nvcc (le Makefile ajoute -Werror all-warnings à NVCCFLAGS pour le
      # kernel .cu).
      - name: Build CUDA=1
        run: make CUDA=1 WERROR=1

      # Combinaison supplémentaire : vérification croisée GPU↔CPU activée
      # (-DGPU_PRUNER_VERIFY) — un chemin de code distinct dans autoprune_gpu.
      # On repart propre (make clean) : le build release supprime déjà build/
      # mais conserve le binaire précédent.
      - name: Build CUDA=1 VERIFY=1
        run: make clean && make CUDA=1 VERIFY=1 WERROR=1

  debug-build:
    name: Build avec les flags DEBUG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les flags DEBUG_* sont des #define laissés commentés dans
      # src/app/static_variables.h : leur code (traces socket/signal/thread,
      # contrôles de possibilités, mono-process…) n'est donc jamais compilé par
      # le build standard et peut « pourrir » sans qu'on le voie (symbole retiré,
      # format printf obsolète, type changé…). On les active TOUS d'un coup via
      # CPPFLAGS (injecté tel quel dans gcc par le Makefile) — sans toucher la
      # source — pour garantir que ces chemins compilent et lient toujours.
      # Comme les jobs ncurses/cuda : compile-check seul, le binaire n'est pas
      # exécuté (DEBUG_IN_MONO_PROCESS change le comportement d'exécution).
      # WERROR=1 : tout warning gcc dans ce code rarement compilé bloque la CI.
      - name: Build avec tous les flags DEBUG_*
        run: >
          make WERROR=1
          CPPFLAGS="-DDEBUG_CHECK_POSSIBILITY -DDEBUG_RM_NO_NEXT -DDEBUG_SOCKET
          -DDEBUG_SIGNAL -DDEBUG_LOCAL_SOCKET -DDEBUG_IN_MONO_PROCESS
          -DDEBUG_COMMANDS -DDEBUG_THREAD"

  config-build:
    name: Build variantes de configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ETERN_PARTS et FORWARD_CHECK_K sont des #define de static_variables.h,
      # guardés par #ifndef → surchargeables via CPPFLAGS sans toucher la source.
      # On compile ici les configurations que le build par défaut (256 / K=6)
      # n'exerce pas, chacune en WERROR=1. Compile-check seul (pas d'exécution).

      # Puzzle 16 pièces (4×4) : branches #if ETERN_PARTS == 256 distinctes
      # (ETERN_SIZE, FACES_USED_SIZE, placement des indices officiels).
      - name: Build ETERN_PARTS=16 (puzzle 4×4)
        run: make WERROR=1 CPPFLAGS="-DETERN_PARTS=16"

      # Forward-checking désactivé : tout le bloc #if FORWARD_CHECK_K > 0 est
      # supprimé à la compilation (chemin conçu exprès). On repart propre.
      - name: Build FORWARD_CHECK_K=0 (forward-checking désactivé)
        run: make clean && make WERROR=1 CPPFLAGS="-DFORWARD_CHECK_K=0"
